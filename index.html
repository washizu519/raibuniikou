```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドライブに行こう！</title>

  <style>
    /* 全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 100px;
      font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      color: #333;
      background-color: #f5f5f5;
    }

    /* ヘッダー */
    header {
      background-color: #FF99CC;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    /* メイン */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #3399CC;
    }

    section {
      background-color: white;
      margin-bottom: 25px;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    section h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #99FFFF;
      color: #333;
      text-align: center;
      padding: 15px 20px;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: #2c3e50;
      margin: 0 8px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>ライブに行こう！</h1>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <section>
      <h2>どのライブに行きますか？</h2>
      <p>
        全国のライブ情報を発信しています。
        あなたの行きたいアーティストのライブにご案内いたします。
      </p>
    </section>

    <section>
      <h2>会場までのアクセス</h2>
      <p>
        各会場までのアクセスをご案内いたします。
      </p>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>お問い合わせ：info@example.com</p>

    <p>
      <a href="#">X</a>
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
    </p>
  </footer>

</body>
</html>
```
